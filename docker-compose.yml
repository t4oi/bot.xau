version: "3.8"

services:
  xauusd-bot:
    build: .
    container_name: xauusd-pro-bot
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "scripts/health_check.py"]
      interval: 60s
      timeout: 15s
      retries: 3
